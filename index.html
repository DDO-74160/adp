<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Argent de Poche - Famille</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, #dbeafe, #e9d5ff);
            min-height: 100vh;
        }
        .sync-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 8px 12px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sync-success { background: #10b981; }
        .sync-error { background: #ef4444; }
        .sync-syncing { background: #f59e0b; }
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="sync-status" class="sync-indicator" style="display: none;"></div>
    <div id="root">
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
            <div style="text-align: center; padding: 2rem; background: white; border-radius: 1rem;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">💰</div>
                <div style="font-size: 1.5rem;">Chargement de l'application...</div>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuration GitHub
        const GITHUB_CONFIG = {
            token: null,
            gistId: null,
            initialized: false
        };

        // Constantes
        const SYNC_INTERVAL = 60000; // 60 secondes (moins agressif)
        const SAVE_DEBOUNCE = 2000; // 2 secondes de debounce

        // Fonctions de chiffrement/déchiffrement CORRIGÉES
        const encryptData = (data, password) => {
            try {
                const jsonString = JSON.stringify(data);
                // CORRECTION: Utiliser .toString() pour obtenir la string chiffrée
                const encrypted = CryptoJS.AES.encrypt(jsonString, password).toString();
                return encrypted;
            } catch (e) {
                console.error('Erreur chiffrement:', e);
                return null;
            }
        };

        const decryptData = (encryptedData, password) => {
            try {
                // CORRECTION: Déchiffrer puis convertir en UTF8
                const decrypted = CryptoJS.AES.decrypt(encryptedData, password);
                const jsonString = decrypted.toString(CryptoJS.enc.Utf8);

                if (!jsonString) {
                    console.error('Déchiffrement a échoué - mot de passe incorrect ?');
                    return null;
                }

                return JSON.parse(jsonString);
            } catch (e) {
                console.error('Erreur déchiffrement:', e);
                return null;
            }
        };

        // Fonctions de synchronisation GitHub
        const createGist = async (data, password) => {
            if (!GITHUB_CONFIG.token) {
                console.error('Token GitHub manquant');
                return null;
            }

            const encryptedData = encryptData(data, password);
            if (!encryptedData) return null;

            try {
                console.log('📤 Création du Gist...');
                const response = await fetch('https://api.github.com/gists', {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        description: 'Argent de poche - Données familiales (chiffrées)',
                        public: false,
                        files: {
                            'pocket-money-data.encrypted': {
                                content: encryptedData
                            }
                        }
                    })
                });

                if (response.ok) {
                    const gist = await response.json();
                    GITHUB_CONFIG.gistId = gist.id;
                    localStorage.setItem('github_gist_id', gist.id);
                    console.log('✅ Gist créé:', gist.id);
                    return gist.id;
                } else {
                    const error = await response.text();
                    console.error('❌ Erreur création Gist:', response.status, error);
                }
            } catch (e) {
                console.error('❌ Erreur réseau création:', e);
            }
            return null;
        };

        const updateGist = async (data, password) => {
            if (!GITHUB_CONFIG.token || !GITHUB_CONFIG.gistId) {
                console.error('Token ou Gist ID manquant');
                return false;
            }

            const encryptedData = encryptData(data, password);
            if (!encryptedData) return false;

            try {
                console.log('📤 Mise à jour Gist...');
                const response = await fetch(`https://api.github.com/gists/${GITHUB_CONFIG.gistId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        files: {
                            'pocket-money-data.encrypted': {
                                content: encryptedData
                            }
                        }
                    })
                });

                if (response.ok) {
                    console.log('✅ Gist mis à jour');
                    return true;
                } else {
                    const error = await response.text();
                    console.error('❌ Erreur MAJ Gist:', response.status, error);
                }
            } catch (e) {
                console.error('❌ Erreur réseau MAJ:', e);
            }
            return false;
        };

        const loadFromGist = async (password) => {
            if (!GITHUB_CONFIG.token || !GITHUB_CONFIG.gistId) {
                console.error('Token ou Gist ID manquant');
                return null;
            }

            try {
                console.log('📥 Chargement Gist...');
                const response = await fetch(`https://api.github.com/gists/${GITHUB_CONFIG.gistId}`, {
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                    }
                });

                if (response.ok) {
                    const gist = await response.json();
                    const encryptedContent = gist.files['pocket-money-data.encrypted'].content;
                    const decrypted = decryptData(encryptedContent, password);

                    if (decrypted) {
                        console.log('✅ Données chargées et déchiffrées');
                        return decrypted;
                    } else {
                        console.error('❌ Échec déchiffrement - mot de passe incorrect ?');
                    }
                } else {
                    const error = await response.text();
                    console.error('❌ Erreur chargement:', response.status, error);
                }
            } catch (e) {
                console.error('❌ Erreur réseau chargement:', e);
            }
            return null;
        };

        const PocketMoneyApp = () => {
          const [currentUser, setCurrentUser] = useState(null);
          const [children, setChildren] = useState([
            { id: 1, name: 'Thomas', balance: 0, avatar: '🧑‍🦱', age: '12 ans', color: 'from-blue-500 to-cyan-500' },
            { id: 2, name: 'Clément', balance: 0, avatar: '👦', age: '10 ans', color: 'from-green-500 to-emerald-500' }
          ]);
          const [transactions, setTransactions] = useState([]);
          const [requests, setRequests] = useState([]); // NOUVEAU: Demandes des enfants
          const [showAddMoney, setShowAddMoney] = useState(false);
          const [showExpense, setShowExpense] = useState(false);
          const [selectedChild, setSelectedChild] = useState(null);
          const [amount, setAmount] = useState('');
          const [description, setDescription] = useState('');
          const [showHistory, setShowHistory] = useState(false);
          const [historyChild, setHistoryChild] = useState(null);
          const [showPasswordModal, setShowPasswordModal] = useState(false);
          const [pendingUser, setPendingUser] = useState(null);
          const [password, setPassword] = useState('');
          const [passwordError, setPasswordError] = useState('');
          const [showChangePassword, setShowChangePassword] = useState(false);
          const [newPassword, setNewPassword] = useState('');
          const [confirmPassword, setConfirmPassword] = useState('');
          const [changePasswordError, setChangePasswordError] = useState('');
          const [showSyncSetup, setShowSyncSetup] = useState(false);
          const [githubToken, setGithubToken] = useState('');
          const [syncStatus, setSyncStatus] = useState('idle');
          const [lastSyncTime, setLastSyncTime] = useState(null);
          const [showRequests, setShowRequests] = useState(false); // NOUVEAU
          const [showMakeRequest, setShowMakeRequest] = useState(false); // NOUVEAU

          const syncIntervalRef = useRef(null);
          const saveTimeoutRef = useRef(null); // Pour le debounce

          // Récupérer le mot de passe stocké ou utiliser le défaut
          const [storedPassword, setStoredPassword] = useState(() => {
            return localStorage.getItem('pocketMoney_password') || '1234';
          });

          const users = [
            { id: 'papa', name: '👨 Papa', role: 'parent' },
            { id: 'maman', name: '👩 Maman', role: 'parent' },
            { id: 'thomas', name: '🧑‍🦱 Thomas', role: 'child' },
            { id: 'clement', name: '👦 Clément', role: 'child' }
          ];

          // Compter les demandes en attente
          const getPendingRequestsCount = () => {
            return requests.filter(r => r.status === 'pending').length;
          };

          // Afficher le statut de sync
          const showSyncStatus = (status, message) => {
            setSyncStatus(status);
            const indicator = document.getElementById('sync-status');
            if (indicator) {
                indicator.style.display = 'block';
                indicator.className = `sync-indicator sync-${status}`;
                indicator.textContent = message;

                if (status === 'success' || status === 'error') {
                    setTimeout(() => {
                        indicator.style.display = 'none';
                    }, 3000);
                }
            }
          };

          // Sauvegarder dans GitHub avec DEBOUNCE
          const saveToGitHub = async () => {
            if (!GITHUB_CONFIG.initialized || !GITHUB_CONFIG.token) {
                return;
            }

            // Annuler le timeout précédent
            if (saveTimeoutRef.current) {
                clearTimeout(saveTimeoutRef.current);
            }

            // Attendre 2 secondes avant de sauvegarder
            saveTimeoutRef.current = setTimeout(async () => {
                showSyncStatus('syncing', '🔄 Synchronisation...');

                const dataToSync = {
                    children,
                    transactions,
                    requests,
                    password: storedPassword,
                    lastUpdate: new Date().toISOString(),
                    version: Date.now()
                };

                let success = false;
                if (GITHUB_CONFIG.gistId) {
                    success = await updateGist(dataToSync, storedPassword);
                } else {
                    const gistId = await createGist(dataToSync, storedPassword);
                    success = !!gistId;
                }

                if (success) {
                    const time = new Date().toLocaleTimeString('fr-FR');
                    setLastSyncTime(time);
                    showSyncStatus('success', '✅ Synchronisé');
                    localStorage.setItem('last_local_update', dataToSync.lastUpdate);
                } else {
                    showSyncStatus('error', '❌ Erreur sync');
                }
            }, SAVE_DEBOUNCE);
          };

          // Charger depuis GitHub
          const loadFromGitHub = async () => {
            if (!GITHUB_CONFIG.initialized || !GITHUB_CONFIG.token) {
                return;
            }

            const data = await loadFromGist(storedPassword);
            if (data) {
                // Vérifier si les données distantes sont plus récentes
                const localUpdate = localStorage.getItem('last_local_update');
                const remoteUpdate = data.lastUpdate;

                if (!localUpdate || new Date(remoteUpdate) > new Date(localUpdate)) {
                    console.log('🔄 Données distantes plus récentes, mise à jour locale');
                    setChildren(data.children || children);
                    setTransactions(data.transactions || []);
                    setRequests(data.requests || []);
                    if (data.password) {
                        setStoredPassword(data.password);
                        localStorage.setItem('pocketMoney_password', data.password);
                    }
                    localStorage.setItem('last_local_update', remoteUpdate);
                    const time = new Date().toLocaleTimeString('fr-FR');
                    setLastSyncTime(time);
                    showSyncStatus('success', '✅ Synchronisé');
                }
            }
          };

          // Force sync
          const forceSync = async () => {
            console.log('🔄 Synchronisation forcée');
            await loadFromGitHub();
            setTimeout(async () => {
                await saveToGitHub();
            }, 1000);
          };

          // Configuration initiale GitHub
          const setupGitHubSync = async () => {
            if (!githubToken.startsWith('ghp_')) {
                alert('❌ Token GitHub invalide. Il doit commencer par "ghp_"');
                return;
            }

            GITHUB_CONFIG.token = githubToken;
            GITHUB_CONFIG.gistId = localStorage.getItem('github_gist_id');
            GITHUB_CONFIG.initialized = true;

            localStorage.setItem('github_token', githubToken);
            console.log('🔑 Token configuré');

            setShowSyncSetup(false);
            setGithubToken('');

            // Tester la synchronisation
            if (GITHUB_CONFIG.gistId) {
                await loadFromGitHub();
            } else {
                await saveToGitHub();
            }

            // Démarrer la synchronisation
            startSyncInterval();

            alert('✅ Synchronisation GitHub activée !\n\n🔒 Données chiffrées avec AES-256\n🔄 Sync automatique toutes les 60 secondes');
          };

          // Démarrer la synchronisation périodique
          const startSyncInterval = () => {
            if (syncIntervalRef.current) {
                clearInterval(syncIntervalRef.current);
            }

            console.log('⏰ Sync périodique démarrée (60s)');
            syncIntervalRef.current = setInterval(() => {
                if (GITHUB_CONFIG.initialized) {
                    loadFromGitHub();
                }
            }, SYNC_INTERVAL);
          };

          // Charger les données au démarrage
          useEffect(() => {
            console.log('🚀 Démarrage application');
            try {
              const savedChildren = localStorage.getItem('pocketMoney_children');
              const savedTransactions = localStorage.getItem('pocketMoney_transactions');
              const savedRequests = localStorage.getItem('pocketMoney_requests');
              const savedToken = localStorage.getItem('github_token');
              const savedGistId = localStorage.getItem('github_gist_id');

              if (savedChildren) setChildren(JSON.parse(savedChildren));
              if (savedTransactions) setTransactions(JSON.parse(savedTransactions));
              if (savedRequests) setRequests(JSON.parse(savedRequests));

              // Configuration GitHub si déjà configurée
              if (savedToken) {
                GITHUB_CONFIG.token = savedToken;
                GITHUB_CONFIG.gistId = savedGistId;
                GITHUB_CONFIG.initialized = true;
                console.log('🔄 Sync GitHub restaurée');
                startSyncInterval();
                setTimeout(() => loadFromGitHub(), 2000);
              }
            } catch (e) {
              console.error('❌ Erreur chargement initial:', e);
            }
          }, []);

          // Sauvegarder automatiquement les changements avec DEBOUNCE
          useEffect(() => {
            localStorage.setItem('pocketMoney_children', JSON.stringify(children));
            if (GITHUB_CONFIG.initialized) saveToGitHub();
          }, [children]);

          useEffect(() => {
            localStorage.setItem('pocketMoney_transactions', JSON.stringify(transactions));
            if (GITHUB_CONFIG.initialized) saveToGitHub();
          }, [transactions]);

          useEffect(() => {
            localStorage.setItem('pocketMoney_requests', JSON.stringify(requests));
            if (GITHUB_CONFIG.initialized) saveToGitHub();
          }, [requests]);

          // Nettoyage
          useEffect(() => {
            return () => {
              if (syncIntervalRef.current) clearInterval(syncIntervalRef.current);
              if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
            };
          }, []);

          const handleUserLogin = (user) => {
            console.log('👤 Connexion:', user.name);
            if (user.role === 'parent') {
              setPendingUser(user);
              setShowPasswordModal(true);
              setPassword('');
              setPasswordError('');
            } else {
              setCurrentUser(user);
            }
          };

          const handlePasswordSubmit = () => {
            if (password === storedPassword) {
              setCurrentUser(pendingUser);
              setShowPasswordModal(false);
              setPendingUser(null);
              setPassword('');
              setPasswordError('');
            } else {
              setPasswordError('Mot de passe incorrect');
              setPassword('');
            }
          };

          const handleChangePassword = async () => {
            if (newPassword.length < 4) {
              setChangePasswordError('Le mot de passe doit faire au moins 4 caractères');
              return;
            }
            if (newPassword !== confirmPassword) {
              setChangePasswordError('Les mots de passe ne correspondent pas');
              return;
            }

            setStoredPassword(newPassword);
            localStorage.setItem('pocketMoney_password', newPassword);
            setShowChangePassword(false);
            setNewPassword('');
            setConfirmPassword('');
            setChangePasswordError('');

            if (GITHUB_CONFIG.initialized) {
              await saveToGitHub();
            }

            alert('✅ Mot de passe modifié avec succès !');
          };

          const addTransaction = (childId, amount, type, description) => {
            const child = children.find(c => c.id === childId);
            const newTransaction = {
              id: Date.now(),
              childId,
              childName: child.name,
              amount: parseFloat(amount),
              type,
              description,
              date: new Date().toLocaleDateString('fr-FR'),
              time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
              addedBy: currentUser.name,
              timestamp: new Date().toLocaleString('fr-FR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              })
            };

            setTransactions(prev => [newTransaction, ...prev]);

            setChildren(prev => prev.map(child =>
              child.id === childId
                ? { ...child, balance: type === 'add' ? child.balance + parseFloat(amount) : child.balance - parseFloat(amount) }
                : child
            ));
          };

          const handleAddMoney = () => {
            if (selectedChild && amount) {
              addTransaction(selectedChild.id, amount, 'add', description || 'Argent de poche');
              setShowAddMoney(false);
              setAmount('');
              setDescription('');
              setSelectedChild(null);
            }
          };

          const handleExpense = () => {
            if (selectedChild && amount) {
              addTransaction(selectedChild.id, amount, 'expense', description || 'Achat');
              setShowExpense(false);
              setAmount('');
              setDescription('');
              setSelectedChild(null);
            }
          };

          // NOUVEAU: Créer une demande (enfant)
          const handleMakeRequest = () => {
            if (!amount || parseFloat(amount) <= 0) {
              alert('⚠️ Veuillez entrer un montant valide');
              return;
            }

            const myChild = getCurrentUserChild();
            const newRequest = {
              id: Date.now(),
              childId: myChild.id,
              childName: myChild.name,
              childAvatar: myChild.avatar,
              amount: parseFloat(amount),
              description: description || 'Demande d\'argent',
              status: 'pending',
              createdAt: new Date().toISOString(),
              timestamp: new Date().toLocaleString('fr-FR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              })
            };

            setRequests(prev => [newRequest, ...prev]);
            setShowMakeRequest(false);
            setAmount('');
            setDescription('');
            alert('✅ Demande envoyée aux parents !');
          };

          // NOUVEAU: Approuver une demande (parent)
          const approveRequest = (requestId) => {
            const request = requests.find(r => r.id === requestId);
            if (!request) return;

            // Ajouter l'argent
            addTransaction(request.childId, request.amount, 'add', `Demande approuvée: ${request.description}`);

            // Marquer la demande comme approuvée
            setRequests(prev => prev.map(r =>
              r.id === requestId ? { ...r, status: 'approved', approvedBy: currentUser.name } : r
            ));
          };

          // NOUVEAU: Refuser une demande (parent)
          const rejectRequest = (requestId) => {
            setRequests(prev => prev.map(r =>
              r.id === requestId ? { ...r, status: 'rejected', rejectedBy: currentUser.name } : r
            ));
          };

          const resetChildData = (childId) => {
            const child = children.find(c => c.id === childId);
            if (window.confirm(`⚠️ Êtes-vous sûr de vouloir remettre à zéro le compte de ${child.name} et son historique ?`)) {
              setChildren(prev => prev.map(c =>
                c.id === childId ? { ...c, balance: 0 } : c
              ));
              setTransactions(prev => prev.filter(t => t.childId !== childId));
              setRequests(prev => prev.filter(r => r.childId !== childId));
            }
          };

          const resetAllData = () => {
            if (window.confirm('⚠️ Êtes-vous sûr de vouloir remettre à zéro TOUS les comptes et l\'historique ?')) {
              const resetChildren = children.map(child => ({ ...child, balance: 0 }));
              setChildren(resetChildren);
              setTransactions([]);
              setRequests([]);
            }
          };

          const getChildTransactions = (childId) => {
            return transactions.filter(t => t.childId === childId);
          };

          const getCurrentUserChild = () => {
            if (currentUser.id === 'thomas') return children.find(c => c.name === 'Thomas');
            if (currentUser.id === 'clement') return children.find(c => c.name === 'Clément');
            return null;
          };

          const getMyRequests = () => {
            const myChild = getCurrentUserChild();
            return myChild ? requests.filter(r => r.childId === myChild.id) : [];
          };

          // Modal de configuration GitHub
          if (showSyncSetup) {
            return (
              <div className="min-h-screen bg-gradient-to-b from-blue-100 to-purple-100 p-4 flex items-center justify-center">
                <div className="bg-white rounded-3xl shadow-lg p-8 w-full max-w-sm">
                  <div className="text-center mb-6">
                    <div className="text-4xl mb-4">🔗</div>
                    <h2 className="text-xl font-bold text-gray-800 mb-2">Configuration GitHub</h2>
                    <p className="text-gray-600 text-sm">Synchronisation automatique entre téléphones</p>
                  </div>

                  <div className="mb-4 p-3 bg-blue-50 rounded-2xl text-sm text-blue-700">
                    <p className="font-bold mb-2">📝 Instructions :</p>
                    <p>1. Allez sur github.com/settings/tokens</p>
                    <p>2. "Generate new token (classic)"</p>
                    <p>3. Cochez "gist"</p>
                    <p>4. Copiez le token ici</p>
                    <p className="mt-2 font-bold">⚠️ MÊME TOKEN sur tous les téléphones !</p>
                  </div>

                  <input
                    type="password"
                    placeholder="Token GitHub (ghp_...)"
                    value={githubToken}
                    onChange={(e) => setGithubToken(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-2xl mb-4 text-sm"
                  />

                  <div className="flex space-x-3">
                    <button
                      onClick={() => setShowSyncSetup(false)}
                      className="flex-1 bg-gray-200 text-gray-800 p-3 rounded-2xl font-medium"
                    >
                      Plus tard
                    </button>
                    <button
                      onClick={setupGitHubSync}
                      className="flex-1 bg-blue-500 text-white p-3 rounded-2xl font-medium"
                    >
                      Activer
                    </button>
                  </div>

                  <div className="mt-4 p-3 bg-green-50 rounded-2xl text-xs text-green-700 text-center">
                    <p>🔒 Chiffrement AES-256 activé</p>
                    <p>📱 Sync automatique toutes les 60 secondes</p>
                    <p>🔐 Gist privé - données sécurisées</p>
                  </div>
                </div>
              </div>
            );
          }

          // Modal de changement de mot de passe
          if (showChangePassword) {
            return (
              <div className="min-h-screen bg-gradient-to-b from-blue-100 to-purple-100 p-4 flex items-center justify-center">
                <div className="bg-white rounded-3xl shadow-lg p-8 w-full max-w-sm">
                  <div className="text-center mb-6">
                    <div className="text-4xl mb-4">🔑</div>
                    <h2 className="text-xl font-bold text-gray-800 mb-2">Changer le mot de passe</h2>

                      <button
                        onClick={() => resetChildData(child.id)}
                        className="w-full bg-orange-400 text-white p-2 rounded-xl text-sm font-medium flex items-center justify-center space-x-1 hover:bg-orange-500"
                      >
                        <span>🔄</span>
                        <span>Reset {child.name}</span>
                      </button>

                      {/* Recent transactions preview */}
                      <div className="mt-4">
                        {getChildTransactions(child.id).slice(0, 2).map(transaction => (
                          <div key={transaction.id} className="flex justify-between items-center py-2 text-sm border-t">
                            <span className="truncate flex-1 mr-2">{transaction.description}</span>
                            <span className={transaction.type === 'add' ? 'text-green-600 font-medium' : 'text-red-600 font-medium'}>
                              {transaction.type === 'add' ? '+' : '-'}{transaction.amount.toFixed(2)}€
                            </span>
                          </div>
                        ))}
                        {getChildTransactions(child.id).length === 0 && (
                          <p className="text-gray-400 text-sm italic text-center py-2">Aucune transaction</p>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                {/* Reset général */}
                <button
                  onClick={resetAllData}
                  className="w-full bg-red-600 text-white p-4 rounded-2xl font-medium flex items-center justify-center space-x-2 hover:bg-red-700 mb-4"
                >
                  <span>⚠️</span>
                  <span>Remise à zéro GÉNÉRALE</span>
                </button>

                {/* Add Money Modal */}
                {showAddMoney && selectedChild && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm">
                      <h3 className="text-xl font-bold mb-4 text-center">💰 Ajouter de l'argent</h3>
                      <p className="text-gray-600 mb-4 text-center">Pour {selectedChild.avatar} {selectedChild.name}</p>

                      <input
                        type="number"
                        step="0.01"
                        placeholder="Montant (€)"
                        value={amount}
                        onChange={(e) => setAmount(e.target.value)}
                        className="w-full p-3 border border-gray-300 rounded-2xl mb-4 text-lg"
                      />

                      <input
                        type="text"
                        placeholder="Description (optionnel)"
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        className="w-full p-3 border border-gray-300 rounded-2xl mb-6"
                      />

                      <div className="flex space-x-3">
                        <button
                          onClick={() => setShowAddMoney(false)}
                          className="flex-1 bg-gray-200 text-gray-800 p-3 rounded-2xl font-medium"
                        >
                          Annuler
                        </button>
                        <button
                          onClick={handleAddMoney}
                          className="flex-1 bg-green-500 text-white p-3 rounded-2xl font-medium"
                        >
                          Confirmer
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* Expense Modal */}
                {showExpense && selectedChild && (
                  <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm">
                      <h3 className="text-xl font-bold mb-4 text-center">🛒 Enregistrer une dépense</h3>
                      <p className="text-gray-600 mb-4 text-center">Pour {selectedChild.avatar} {selectedChild.name}</p>

                      <input
                        type="number"
                        step="0.01"
                        placeholder="Montant (€)"
                        value={amount}
                        onChange={(e) => setAmount(e.target.value)}
                        className="w-full p-3 border border-gray-300 rounded-2xl mb-4 text-lg"
                      />

                      <input
                        type="text"
                        placeholder="Description de l'achat"
                        value={description}
                        onChange={(e) => setDescription(e.target.value)}
                        className="w-full p-3 border border-gray-300 rounded-2xl mb-6"
                      />

                      <div className="flex space-x-3">
                        <button
                          onClick={() => setShowExpense(false)}
                          className="flex-1 bg-gray-200 text-gray-800 p-3 rounded-2xl font-medium"
                        >
                          Annuler
                        </button>
                        <button
                          onClick={handleExpense}
                          className="flex-1 bg-red-500 text-white p-3 rounded-2xl font-medium"
                        >
                          Confirmer
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        };

        // Rendu de l'application
        ReactDOM.render(<PocketMoneyApp />, document.getElementById('root'));
    </script>
</body>
</html>
